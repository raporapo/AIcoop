name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 対応OSは macOS と Linux（設計書 11.1）。Windows は WSL2 の中で動かすので Linux と同じ扱い
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # vm の箱（Gondolin の microVM）を本当に起こす結合テスト（16章 V-1・V-2・V-4・V-6、P1 完了条件1・3、5.1.4、5.1.7）。
  # 時間がかかるので verify とは別のジョブにする。
  vm-integration:
    name: vm integration (Gondolin, KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: KVM を使えるようにする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: QEMU を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          qemu-system-x86_64 --version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 結合テスト
        env:
          AICOOP_VM_IT: "1"
        run: pnpm vitest run packages/box-gondolin/src/vm.integration.test.ts --reporter=verbose

  # P1 の完了条件（14章）を、本物の vm の箱で端から端まで確かめる：雛形の会社・本物の制御サーバー（startDaemon）・
  # 1件の実行（startRun）・Gondolin のドライバー。Claude Code の代わりに偽の claude（シェルスクリプト）を入れた
  # イメージを組み立てて使う（packages/daemon/src/p1.vm.e2e.test.ts）
  vm-e2e:
    name: vm e2e (P1, Gondolin, KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: KVM を使えるようにする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: QEMU と mke2fs を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils e2fsprogs
          qemu-system-x86_64 --version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: P1 の完了条件の結合テスト
        env:
          AICOOP_VM_E2E: "1"
        run: pnpm vitest run packages/daemon/src/p1.vm.e2e.test.ts --reporter=verbose

  # vm のベースイメージ（5.1.8）を組み立て、その箱で Claude Code が動くか確かめる（16章 V-9）
  vm-image:
    name: vm image (5.1.8, V-9)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: KVM を使えるようにする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: QEMU と mke2fs を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils e2fsprogs
          qemu-system-x86_64 --version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: イメージの組み立てと結合テスト
        env:
          AICOOP_VM_IT_IMAGE: "1"
        run: pnpm vitest run packages/box-gondolin/src/vm.integration.test.ts --reporter=verbose
