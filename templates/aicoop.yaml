# =============================================================================
# aicoop.yaml：会社全体の設定（設計書 6.2）
# =============================================================================
#
# このフォルダ（~/.aicoop/）の設定ファイルは、次の5つです。
#   aicoop.yaml    会社全体の設定（このファイル）
#   groups.yaml    部署。箱の種類と、部署でできることの上限
#   roles.yaml     役職。役職ごとに許したいこと
#   members.yaml   社員（AI）。だれが、どの部署で、どの役職か
#   triggers.yaml  仕事を始めるきっかけ（決まった時刻など）
#   prompts/       会社・部署・役職の「やり方」を書いた文章（md）
#
# 設定を変えたら：
#   1. aicoop check   で確かめる（誤りがあれば、どのファイルのどこを直せばよいかが出ます）
#   2. aicoop reload  で読み直す（保存しただけでは反映されません。
#                     動いている仕事は、始まったときの設定のまま最後まで動きます）
#
# - 書いていないキーは、ここに書いてある値（既定値）になります。
# - 範囲を外れた値・知らないキー（打ち間違い）はエラーになり、daemon は起動しません。
# - 「# 」で始まる行はコメントです。
# - [P2] などの印は、その機能が使えるようになる段階です（設計書 14章）。いまは P1 です。
# - 「▼」から「▲」までは、後の段階で使う設定をコメントにしてあります。
#   使うときは、その間の各行の先頭の「# 」を1つずつ消してください。

company:
  # 会社のID。aicoop init が作りました。承認アプリと監査ログが、この値で会社を見分けます。
  # 変えてはいけません。
  id: "{{company_id}}"
  # 承認アプリに出す会社の名前。自由に変えてかまいません。
  name: "{{company_name}}"

# 時刻の基準にするタイムゾーン（IANA形式。例：Asia/Tokyo、UTC、America/New_York）。
# cron トリガーの時刻と、「1日あたり」の数え方に使います。
timezone: "Asia/Tokyo"

daemon:
  # 設定の置き場所。書かなければ、いま読んでいる場所（ふつうは ~/.aicoop）です。
  # 書くなら、実際の置き場所と同じにしてください（違うとエラーになります）。
  # home: "~/.aicoop"

  # 制御サーバーが待ち受けるポート。127.0.0.1 だけで待ち受け、PCの外からはつながりません。
  # ほかのソフトと重なるときだけ変えてください。
  port: 7070

  # 同時に起動してよい箱の数（1〜16）。
  # 箱1つが、その部署の memory_mib（groups.yaml）だけメモリを使います。
  # 「この数 × いちばん大きい memory_mib」が、PCの空いているメモリに収まるようにしてください。
  max_concurrent_boxes: 3

task:
  # 1回の仕事（実行）の時間制限（分。1〜55）。
  # 時間切れになると止めて、タスクを timeout にします。
  # 55分より長くできないのは、実行のたびに発行するトークンの有効期限が1時間だからです。
  timeout_minutes: 45

# 中身を開かずに素通しする宛先。箱の中の Claude Code が Anthropic と話すためのものです。
# ここに書いた宛先への通信はルールの判定を通らないので、ほかのホストは足さないでください。
anthropic_passthrough_hosts:
  - "api.anthropic.com"

audit:
  # 監査ログ（何が起きたかの記録）を残す日数（30〜3650）。
  # 記録が書き換えられていないかは aicoop audit verify で確かめられます。
  retention_days: 365

# ---- ここから下は、P2 以降の機能の設定です。いまは既定値のままでかまいません ----

holds:
  # [P2] 重い操作（mode: hold）の承認を待つ時間（時間。1〜168）。過ぎると取り消されます。
  ttl_hours: 72

grants:
  # [P2] 一時権限（AI社員が申請して、オーナーが認めるもの）の長さの上限（時間。1〜720）
  max_hours: 168

sessions:
  # [P2] 最後に使ってからこの日数（1〜365）を過ぎたスレッドは、新しい会話から始めます。
  # 知識は /work/notes/ に残っているので、引き継がれます。
  max_idle_days: 30

relay:
  # [P3] スマホの承認アプリとつなぐ中継の URL（https:// で始まるもの）。空なら中継を使いません。
  url: ""

tickets:
  # [P4] 部署から部署への依頼票が、「依頼の依頼」とつながってよい深さ（1〜5）
  max_depth: 2
  # [P4] 会社全体で、1日に出せる依頼票の数（0〜1000）
  daily_limit: 20

runtimes:
  # [P5] 補助の機能に使うローカルLLM（Ollama）の URL。例 "http://127.0.0.1:11434"。空なら使いません。
  # AI社員の仕事そのものには使いません（Claude の利用枠に達したら、待ちます）。
  local_llm: ""

# ▼ [P6] 人宛ての依頼（ほかの会社の人に頼む・頼まれる）。members.yaml の CEO と一緒に使います
# humans:
#   # 1日に出せる、人宛ての依頼の数（0〜20）
#   daily_limit: 3
#   # 人から届いた依頼を受ける社員（ふつうは CEO）
#   intake_member: "ceo"
# ▲
